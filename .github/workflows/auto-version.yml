# Bump package.json version on push to main based on commit message.
# Use [major], [minor], or [patch] in the commit message; default is patch.
# Use [skip autover] to skip version bump.
#
# To have the Release workflow run when a tag is pushed, set repo secret
# REPO_ACCESS_TOKEN to a PAT with "contents" (read/write) scope. Pushes made
# with GITHUB_TOKEN do not trigger other workflows.

name: Auto Version

on:
  push:
    branches:
      - main

env:
  PACKAGE_JSON_PATH: oasys-tui/package.json

jobs:
  auto-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.REPO_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Check for skip autover
        id: check_skip
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if [[ "$COMMIT_MSG" == *"[skip autover]"* ]]; then
            echo "skip_autover=true" >> $GITHUB_OUTPUT
            echo "Skipping autover due to [skip autover] in commit message"
          else
            echo "skip_autover=false" >> $GITHUB_OUTPUT
            echo "Proceeding with autover..."
          fi

      - name: Get current version
        id: current_version
        if: steps.check_skip.outputs.skip_autover != 'true'
        run: |
          CURRENT_VERSION=$(grep -o '"version"[[:space:]]*:[[:space:]]*"[^"]*"' ${{ env.PACKAGE_JSON_PATH }} | sed 's/.*"\([^"]*\)".*/\1/')
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION"

      - name: Parse version components
        id: version_components
        if: steps.check_skip.outputs.skip_autover != 'true'
        run: |
          VERSION_PART="${{ steps.current_version.outputs.current_version }}"
          MAJOR=$(echo $VERSION_PART | cut -d'.' -f1)
          MINOR=$(echo $VERSION_PART | cut -d'.' -f2)
          PATCH=$(echo $VERSION_PART | cut -d'.' -f3)

          echo "major=$MAJOR" >> $GITHUB_OUTPUT
          echo "minor=$MINOR" >> $GITHUB_OUTPUT
          echo "patch=$PATCH" >> $GITHUB_OUTPUT

          echo "Current version components: Major=$MAJOR Minor=$MINOR Patch=$PATCH"

      - name: Determine version bump type
        id: bump_type
        if: steps.check_skip.outputs.skip_autover != 'true'
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          echo "Commit message: $COMMIT_MSG"

          if [[ "$COMMIT_MSG" == *"[major]"* ]]; then
            echo "bump_type=major" >> $GITHUB_OUTPUT
            echo "Version bump: MAJOR"
          elif [[ "$COMMIT_MSG" == *"[minor]"* ]]; then
            echo "bump_type=minor" >> $GITHUB_OUTPUT
            echo "Version bump: MINOR"
          elif [[ "$COMMIT_MSG" == *"[patch]"* ]]; then
            echo "bump_type=patch" >> $GITHUB_OUTPUT
            echo "Version bump: PATCH"
          else
            echo "bump_type=patch" >> $GITHUB_OUTPUT
            echo "Version bump: PATCH (default for commits without version tags)"
          fi

      - name: Calculate new version
        id: new_version
        if: steps.check_skip.outputs.skip_autover != 'true'
        run: |
          MAJOR="${{ steps.version_components.outputs.major }}"
          MINOR="${{ steps.version_components.outputs.minor }}"
          PATCH="${{ steps.version_components.outputs.patch }}"
          BUMP_TYPE="${{ steps.bump_type.outputs.bump_type }}"

          case $BUMP_TYPE in
            "major")
              NEW_MAJOR=$((MAJOR + 1))
              NEW_MINOR=0
              NEW_PATCH=0
              ;;
            "minor")
              NEW_MAJOR=$MAJOR
              NEW_MINOR=$((MINOR + 1))
              NEW_PATCH=0
              ;;
            "patch")
              NEW_MAJOR=$MAJOR
              NEW_MINOR=$MINOR
              NEW_PATCH=$((PATCH + 1))
              ;;
            *)
              NEW_MAJOR=$MAJOR
              NEW_MINOR=$MINOR
              NEW_PATCH=$PATCH
              ;;
          esac

          NEW_VERSION="${NEW_MAJOR}.${NEW_MINOR}.${NEW_PATCH}"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Update package.json
        if: steps.check_skip.outputs.skip_autover != 'true'
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.new_version }}"
          sed -i "s/\"version\"[[:space:]]*:[[:space:]]*\"[^\"]*\"/\"version\": \"$NEW_VERSION\"/" ${{ env.PACKAGE_JSON_PATH }}
          echo "Updated ${{ env.PACKAGE_JSON_PATH }} with version: $NEW_VERSION"

      - name: Verify changes
        if: steps.check_skip.outputs.skip_autover != 'true'
        run: |
          echo "Updated package.json:"
          grep '"version"' ${{ env.PACKAGE_JSON_PATH }}

      - name: Configure Git
        if: steps.check_skip.outputs.skip_autover != 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Commit and push changes
        if: steps.check_skip.outputs.skip_autover != 'true'
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.new_version }}"
          OLD_VERSION="${{ steps.current_version.outputs.current_version }}"

          git add ${{ env.PACKAGE_JSON_PATH }}
          git commit -m "chore: bump version from $OLD_VERSION to $NEW_VERSION [skip autover]"
          git push origin main

          echo "Successfully updated version from $OLD_VERSION to $NEW_VERSION"

      - name: Create and push tag
        if: steps.check_skip.outputs.skip_autover != 'true'
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.new_version }}"
          TAG="v${NEW_VERSION}"
          git tag "$TAG"
          git push origin "$TAG"
          echo "Created and pushed tag: $TAG"

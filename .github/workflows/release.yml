# Build and publish oasys CLI when a version tag is pushed (e.g. v1.0.0).
# Each platform builds on its own runner (no cross-compile). Artifacts are
# collected and attached to a single GitHub Release.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: darwin-arm64
          - runner: ubuntu-latest
            target: linux-x64
          - runner: windows-latest
            target: windows-x64
          # Optional: add when your org has ARM runners or use correct partner image label:
          # - runner: ubuntu-24.04-arm64
          #   target: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: oasys-tui
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: oasys-tui
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          BUILD_TARGET: ${{ matrix.target }}
        run: chmod +x scripts/build.sh && ./scripts/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oasys-${{ matrix.target }}
          path: oasys-tui/dist/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
